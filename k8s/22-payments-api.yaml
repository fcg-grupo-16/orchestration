apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-config
  namespace: fcg
  labels:
    app: payments-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Traces distribuídos por OTLP para o Jaeger (issue #27). Nomes padrão do OpenTelemetry,
  # lidos automaticamente pelo SDK. Endpoint AUSENTE = exportador desligado, que é o que
  # mantém `dotnet run` e os testes de integração funcionando sem Jaeger no ar.
  OTEL_SERVICE_NAME: "payments-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  RabbitMq__Host: "rabbitmq"
  Payments__MaxApprovedAmount: "5000"
  # Database próprio (database-per-service). A connection string (com ?replicaSet=rs0) é
  # sensível e vem do SealedSecret payments-api-secret. Consumido a partir da payments-api#2.
  MongoDbSettings__DatabaseName: "paymentsdb"
---
# O Secret `payments-api-secret` agora vem CIFRADO de k8s/05-sealed-secrets.yaml (Sealed Secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: fcg
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
      annotations:
        # Descoberta pelo Prometheus (issue #27). O scrape_config `fcg-pods` filtra por esta
        # annotation, lê a porta daqui e usa o label `app` acima como label `service` nas séries.
        # O endpoint /metrics passa a existir com a instrumentação OpenTelemetry do serviço.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo "aguardando mongodb..."; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done']
      containers:
        - name: payments-api
          image: payments-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-api-config
            - secretRef:
                name: payments-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # PROBES (issue #38) — valores EXPLÍCITOS, nunca os defaults.
          #
          # `timeoutSeconds` omitido vale **1 segundo** no Kubernetes. Em repouso este serviço
          # responde em milissegundos — medido aqui, n=30: máximo de 2 ms em `/health/ready` e 3 ms
          # em `/health/live`. O `/health` agregado também existe neste serviço (máximo de 2 ms), mas
          # as probes usam os caminhos dedicados.
          #
          # ⚠️ Ao contrário do `users-api`, este container NUNCA foi morto por liveness. O que se
          # observou sob contenção foi a READINESS estourando o teto de 1 s — `Readiness probe
          # failed: Get ".../health/ready": context deadline exceeded`, 21 ocorrências
          # agregadas num único episódio. Readiness falhando não mata o Pod, mas o **tira do
          # Service**, e é isso que propaga a cascata: quem depende dele perde o endpoint.
          # Por isso o conserto aqui é dar margem, não trocar caminho — os caminhos já estavam
          # certos (`/health/live` para liveness, `/health/ready` para readiness).
          #
          # 5 s dá ~1600x de folga sobre o pior caso medido (3 ms), sem mascarar serviço travado: com
          # failureThreshold 3, um travamento real ainda é detectado em ~45 s.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: fcg
  labels:
    app: payments-api
spec:
  type: ClusterIP
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: 8080
