apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
  labels:
    app: users-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Traces distribuídos por OTLP para o Jaeger (issue #27). Nomes padrão do OpenTelemetry,
  # lidos automaticamente pelo SDK. Endpoint AUSENTE = exportador desligado, que é o que
  # mantém `dotnet run` e os testes de integração funcionando sem Jaeger no ar.
  OTEL_SERVICE_NAME: "users-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  RabbitMq__Host: "rabbitmq"
  MongoDbSettings__DatabaseName: "usersdb"
  # Cache distribuído (Fase 3). Prefixo de TODA chave escrita por este serviço: é o que
  # isola logicamente os keyspaces na instância compartilhada de Redis. A connection
  # string é sensível e vem do SealedSecret users-api-secret.
  Redis__InstanceName: "fcg:users:"
  # Operação atrás do Kong (issue #26). X-Forwarded-* é header que o CLIENTE controla, então a
  # confiança fica restrita às redes do cluster: pods e Services do minikube. Sem isto o users-api
  # vê o IP do pod do Kong para TODOS os clientes, e o rate limiter de login (que particiona por
  # Connection.RemoteIpAddress) vira um bucket global — alguém errando a senha bloquearia o login
  # de todos. Os MESMOS CIDRs valem para o catalog-api.
  #
  # ⚠️ O users-api#21 adicionou estas chaves em users-api/k8s/configmap.yaml, que NÃO é aplicado
  # pelo scripts/deploy-minikube.sh (ele aplica apenas orchestration/k8s/). Sem esta cópia aqui, a
  # feature nasceria inerte no cluster.
  ForwardedHeaders__Enabled: "true"
  ForwardedHeaders__KnownNetworks__0: "10.244.0.0/16"
  ForwardedHeaders__KnownNetworks__1: "10.96.0.0/12"
  ForwardedHeaders__ForwardLimit: "1"
  JwtSettings__Issuer: "FiapCloudGames"
  JwtSettings__Audience: "FiapCloudGames"
---
# O Secret `users-api-secret` agora vem CIFRADO de k8s/05-sealed-secrets.yaml (Sealed Secrets).
# JwtSettings__SecretKey é idêntica à do catalog-api-secret (JWT parity) — ver seal-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
  labels:
    app: users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
      annotations:
        # Descoberta pelo Prometheus (issue #27). O scrape_config `fcg-pods` filtra por esta
        # annotation, lê a porta daqui e usa o label `app` acima como label `service` nas séries.
        # O endpoint /metrics passa a existir com a instrumentação OpenTelemetry do serviço.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo "aguardando mongodb..."; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "aguardando redis..."; sleep 2; done']
      containers:
        - name: users-api
          image: users-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: users-api-config
            - secretRef:
                name: users-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: fcg
  labels:
    app: users-api
spec:
  type: ClusterIP
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 8080
