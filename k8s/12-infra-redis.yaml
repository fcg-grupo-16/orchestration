# Redis — camada de cache distribuído da plataforma FCG (Fase 3, issue #25).
#
# Consumido por users-api (users-api#20) e catalog-api (catalog-api#21) para cachear consultas
# onerosas. APENAS CACHE.
#
# ⚠️ A notifications-function NÃO usa mais esta instância. O store de idempotência dela mora no
# k8s/12b-infra-redis-idempotencia.yaml, num Redis próprio e durável (issue #35). O texto anterior
# aqui dizia que ela usava — e, na mesma frase, que perder o conteúdo é aceitável porque "todo dado
# aqui é reconstruível a partir do MongoDB". As duas afirmações não podiam ser verdadeiras ao mesmo
# tempo: a chave que impede e-mail duplicado não é reconstruível de lugar nenhum.
#
# Deployment (não StatefulSet) e SEM PersistentVolumeClaim, DE PROPÓSITO: é CACHE. Todo dado aqui é
# reconstruível a partir do MongoDB, então perder o conteúdo na recriação do Pod é aceitável — e
# evita carregar um PVC que não agregaria nada. É a diferença deliberada em relação ao
# 10-infra-mongodb.yaml, que É banco e por isso é StatefulSet com volumeClaimTemplates.
# Coerente com o compose, onde o Redis também sobe com `--save ""` e `--appendonly no`.
#
# ISOLAMENTO ENTRE SERVIÇOS É LÓGICO, por prefixo de chave (Redis__InstanceName: fcg:users: /
# fcg:catalog:). Uma instância, keyspaces distintos — mesma filosofia do database-per-service que
# aplicamos no Mongo, sem o custo de subir um Redis por serviço num ambiente de demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fcg
  labels:
    app: redis
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  replicas: 1
  # Recreate, NÃO o RollingUpdate default. Com replicas: 1 o maxSurge de 25% arredonda para 1, então
  # o pod novo subiria ANTES de o velho morrer e o Service balancearia entre DOIS Redis com estados
  # diferentes por alguns segundos — para cache isso é só um miss, mas um miss inconsistente e
  # difícil de diagnosticar. Derrubar antes de subir é o comportamento certo para um cache.
  # (O mesmo raciocínio, aplicado à idempotência, é o que torna o 12b um StatefulSet de réplica
  # única: lá a divergência entre dois pods não é um miss, é e-mail duplicado.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          imagePullPolicy: IfNotPresent
          # Mesmos flags do docker-compose.yml (paridade dev/prod).
          args:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              # Igual ao --maxmemory: é o consumo de REGIME, não o de idle. Requisitar menos
              # (ex.: 64Mi) colocaria o pod em QoS Burstable com 192Mi acima do request, e o
              # kubelet rankeia despejo por uso ACIMA do request — o Redis viraria o primeiro
              # candidato a eviction do namespace sob pressão de memória do nó, apagando o cache
              # de todos os serviços.
              memory: 256Mi
            limits:
              # O limite do container fica ACIMA do --maxmemory do Redis (256Mi) de propósito, para
              # dar folga ao overhead do processo e à fragmentação do allocator. Se fosse igual, o
              # kernel mataria o container (OOMKilled) ANTES de o Redis aplicar a evicção LRU — ou
              # seja, o mecanismo de proteção nunca chegaria a rodar.
              # 2x o maxmemory, alinhado com o precedente do repo (Mongo 256Mi/512Mi, RabbitMQ
              # 512Mi/1Gi). O `maxmemory` do Redis contabiliza o allocator, NÃO o RSS: fragmentação
              # do jemalloc e os client output buffers (ilimitados por default para clientes
              # normais, e inflados por um `--scan` grande) ficam fora dessa conta e entram na do
              # kernel. 1,5x seria margem apertada demais para essa cauda.
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            # timeoutSeconds explícito, como já fazem 10-infra-mongodb.yaml e 11-infra-rabbitmq.yaml:
            # o default é 1s, e uma exec probe faz fork+exec de um processo novo a cada ciclo. Sob
            # throttling de CPU (300m) com evicção LRU ativa, isso passa de 1s — e três falhas
            # seguidas matariam o container, apagando o cache inteiro da plataforma por um falso
            # positivo.
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fcg
  labels:
    app: redis
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
