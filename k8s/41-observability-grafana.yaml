# Grafana — visualização das métricas e dos traces (Fase 3, issue #27).
#
# Datasources e dashboards são PROVISIONADOS por ConfigMap (arquivos em /etc/grafana/provisioning).
# É isso que faz o dashboard ser um artefato VERSIONADO no repositório em vez de um clique que só
# existe no navegador de quem criou: se o Pod for recriado, ou outra pessoa subir o ambiente, o
# dashboard volta idêntico. O JSON fica em observability/fcg-overview.json e é embutido no
# ConfigMap gerado k8s/41b-grafana-dashboard.yaml.
#
# Credencial de demonstração (admin/admin), no mesmo espírito do guest/guest do RabbitMQ. A UI não
# é exposta fora do cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fcg
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: fcg-prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      # Datasource de traces. Cobre o terceiro pilar da observabilidade, que o desafio só exige na
      # Opção B — aqui sai praticamente de graça porque o MassTransit já propaga contexto W3C.
      - name: Jaeger
        type: jaeger
        uid: fcg-jaeger
        access: proxy
        url: http://jaeger:16686
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fcg
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: fcg
        orgId: 1
        folder: FCG
        type: file
        disableDeletion: false
        # Permite editar pela UI durante a demonstração; a fonte da verdade continua sendo o
        # arquivo versionado, que volta no próximo restart do Pod.
        allowUiUpdates: true
        options:
          # /etc/grafana/dashboards e NÃO /var/lib/grafana/dashboards: montar o ConfigMap dentro
          # de /var/lib/grafana colidiria com o emptyDir montado na raiz desse diretório (o mount
          # mais profundo esconde o conteúdo do mais raso, e o Grafana não acharia nada).
          path: /etc/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fcg
  labels:
    app: grafana
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        # Força o rollout quando o JSON do dashboard muda: sem isto, `kubectl apply` atualizaria só
        # o ConfigMap e o Grafana continuaria servindo o dashboard antigo até alguém matar o Pod.
        # (O valor é atualizado à mão quando o dashboard muda de forma relevante.)
        fcg.dashboard/revision: "1"
    spec:
      securityContext:
        # A imagem do Grafana roda como uid 472 e precisa escrever em /var/lib/grafana.
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            # Sem telemetria e sem banner de "novidades" atrapalhando a gravação do vídeo.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-fcg
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fcg
  labels:
    app: grafana
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
