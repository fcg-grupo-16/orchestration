# VALIDAÇÃO DE JWT NA BORDA. NAS 5 ROTAS PROTEGIDAS, sem token válido o Kong responde 401 e a
# requisição NUNCA chega ao microsserviço — o pacote não sai do namespace kong. Os serviços
# continuam validando por conta própria (defense in depth): a borda não substitui a autorização
# do serviço, ela a antecipa.
#
# ⚠️ O escopo importa: as rotas PÚBLICAS (`/api/v1/auth/` e o cadastro) são anônimas por
# construção e não têm este plugin. O prefixo `/api/v1/auth/` não é restrito por método, então
# qualquer verbo e qualquer subpath sob ele chegam ao users-api sem token (medido:
# `PUT /api/v1/auth/login` -> 405 do Kestrel, `GET /api/v1/auth/qualquercoisa` -> 404 do Kestrel).
# A superfície ali é o AuthController inteiro — é o desenho pretendido, não um bypass, mas a frase
# acima não vale para esse prefixo.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-jwt
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: jwt
config:
  # `iss` já é o default, mas explicitar documenta o acoplamento com JwtSettings__Issuer.
  key_claim_name: iss
  # Valida a expiração. SEM isto um token expirado passaria pela borda — o plugin só verifica as
  # claims listadas aqui.
  claims_to_verify:
    - exp
  # Superfície mínima: SÓ o header Authorization.
  #
  # ⚠️ Os três campos são INDEPENDENTES, e declarar `header_names` NÃO fecha os outros dois. O
  # default de `uri_param_names` é ["jwt"], então o plugin aceitava token pela QUERYSTRING. Medido:
  # `?jwt=<válido>` -> 200, e `?jwt=<forjado com chave errada>` -> 401, o que prova que o Kong lia e
  # validava a assinatura a partir da URL. Consequência: o token inteiro ia para o access log do
  # gateway (`GET /api/v1/jogos?jwt=eyJ...`), legível por qualquer um com acesso a log de pod, e
  # reproduzível em histórico de browser, proxy e header Referer.
  # As duas listas vazias abaixo consertam o que é consertável aqui: o token deixa de AUTENTICAR
  # pela URL. Medido DEPOIS do conserto: `?jwt=<válido>` -> 401 e header válido -> 200.
  #
  # ⚠️ LIMITAÇÃO RESIDUAL — isto NÃO elimina o vazamento no log. Se um cliente ainda puser o token
  # na URL, o Kong registra a querystring no access log do mesmo jeito (medido depois do conserto:
  # 2 linhas `GET /api/v1/jogos?jwt=eyJ...`). E o token logado continua VÁLIDO — o gateway só se
  # recusa a lê-lo dali —, portanto quem ler o log ainda o usa pelo header. Eliminar isso exigiria
  # formato de log sem `$request_uri` ou desligar o access log do proxy: decisão de observabilidade,
  # não tomada aqui.
  header_names:
    - Authorization
  uri_param_names: []
  cookie_names: []
  # Nossa chave é string UTF-8 crua, não base64.
  secret_is_base64: false
  # Exigir JWT TAMBÉM no preflight (OPTIONS).
  #
  # `run_on_preflight: false` é a recomendação QUANDO existe um plugin `cors` respondendo ao
  # preflight — e não existe nenhum aqui. Com `false` e sem cors, a exceção não habilitava CORS
  # nenhum e só abria um caminho ANÔNIMO ao upstream nas 5 rotas protegidas: medido,
  # `OPTIONS /api/v1/jogos` sem token devolvia 405 com `Server: Kestrel` e a requisição aparecia no
  # log do catalog-api — contradizendo a afirmação de que sem token nada sai do namespace kong.
  # Se um dia houver plugin `cors`, reavaliar os dois juntos.
  run_on_preflight: true
---
# RATE LIMITING na borda — com uma LIMITAÇÃO IMPORTANTE que não é contornável aqui.
#
# ⚠️ NA PRÁTICA ESTE É UM BUCKET GLOBAL PARA TODO CLIENTE EXTERNO. Medido no cluster:
#
#   • Via `kubectl port-forward` (o único caminho de acesso documentado): o access log do Kong
#     registra 127.0.0.1 para TODAS as requisições, de qualquer cliente.
#   • Via NodePort 30080: o Service kong-kong-proxy tem `externalTrafficPolicy: Cluster`, então o
#     kube-proxy faz SNAT e todo cliente externo chega com o IP do nó.
#   • O contador é compartilhado entre as 5 rotas protegidas. Medido em sequência:
#     jogos=116 -> biblioteca=115 -> pedidos=114 -> jogos=113 -> avaliacoes=112.
#
#   Consequência: são 120/min para a PLATAFORMA INTEIRA vista de fora, e um cliente que esgote a
#   cota faz todos os outros receberem 429. Isto NÃO foi corrigido — é limitação conhecida.
#
# Por que `limit_by: ip` ainda assim, e não `consumer`: com `consumer` o colapso é garantido por
# construção, independente de topologia, porque todo JWT do users-api tem `iss: FiapCloudGames` e
# o plugin jwt resolve o consumer por essa claim — todos casam com o ÚNICO KongConsumer.
# `limit_by: credential` tem o mesmo defeito. Limite real por usuário exigiria um KongConsumer por
# usuário, o que não é declarável para usuários dinâmicos. `ip` é o menos errado dos declaráveis, e
# passa a isolar de verdade se um dia houver LoadBalancer real com preservação de IP de origem
# (`externalTrafficPolicy: Local`) ou `trusted_ips`/`real_ip_header` configurados NO KONG.
#
# ⚠️ E o `ForwardedHeaders__*` dos serviços NÃO ajuda aqui: ele governa o RemoteIpAddress que
# users-api/catalog-api leem do X-Forwarded-For que o Kong escreve — e esse valor é 127.0.0.1 para
# todos. Então o rate limiter de login do próprio users-api também é global hoje.
#
# ⚠️ SEGUNDA LIMITAÇÃO: requisição NÃO AUTENTICADA não consome cota nas rotas protegidas.
# O plugin jwt (prioridade 1005) roda ANTES do rate-limiting (901) e encerra a requisição, então a
# resposta 401 sai SEM headers RateLimit-* (medido: 0 headers no 401, 3 no 200). Um flood anônimo
# com `Authorization: Bearer lixo` nas rotas protegidas não é limitado na borda. Prioridade de
# plugin no Kong é fixa por tipo — não há como invertê-la declarativamente. O que protege o
# caminho anônimo é o fcg-rate-limit-publico, aplicado às rotas públicas.
#
# `policy: local` = contadores na memória de cada réplica. Com 1 réplica (nosso caso) é exato;
# com N réplicas o limite efetivo seria N × minute. Contador global exigiria `policy: redis`.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-rate-limit
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: rate-limiting
config:
  minute: 120
  policy: local
  limit_by: ip
  # Devolve os headers RateLimit-* (padrão IETF) para o cliente saber quanto sobrou.
  hide_client_headers: false
  # Falha ABERTA de propósito: se o backend de contagem falhar, não derrube a API.
  # Indisponibilidade do contador não pode virar indisponibilidade do produto.
  fault_tolerant: true
---
# RATE LIMITING das rotas PÚBLICAS — mais restritivo que o das protegidas, de propósito.
#
# Antes, `login`, `refresh` e o CADASTRO não tinham limite algum na borda. O cadastro é o único
# caminho de ESCRITA anônimo da plataforma e o menos protegido: `UsuariosController.Criar` não tem
# `[EnableRateLimiting]` (ao contrário do login, que tem no serviço). Sem limite, é criação
# ilimitada de contas — flood no Mongo e um UserCreatedEvent por requisição no RabbitMQ.
#
# O desenho anterior estava invertido: tráfego autenticado limitado, anônimo livre.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-rate-limit-publico
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: rate-limiting
config:
  minute: 20
  policy: local
  limit_by: ip
  hide_client_headers: false
  fault_tolerant: true
---
# CORRELATION ID: o Kong gera um X-Correlation-Id por requisição, propaga para o upstream e
# (com echo_downstream) devolve ao cliente. O CorrelationIdMiddleware de users-api/catalog-api lê
# o header e o coloca em HttpContext.TraceIdentifier, além de ecoá-lo na resposta.
#
# ⚠️ O QUE ISTO **NÃO** FAZ, apesar de ser tentador supor: o id NÃO entra nos logs dos serviços.
# Verificado no cluster — `kubectl logs deploy/users-api` tem ZERO ocorrências de correlation.
# O middleware não empurra o valor para o LogContext do Serilog, então o log estruturado sai com
# @tr/@sp (trace e span do OpenTelemetry) e RequestId, e nenhum campo de correlation.
#
# Para rastrear uma requisição ponta a ponta HOJE, o caminho que funciona é o **TraceId** (@tr no
# log, e o mesmo id no Jaeger). O valor prático deste plugin é dar ao cliente um id citável num
# relato de erro. Enriquecer o log com o correlation-id é melhoria de serviço (users-api /
# catalog-api), não de gateway.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-correlation-id
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: correlation-id
config:
  header_name: X-Correlation-Id
  generator: uuid
  # Devolve o id ao cliente também: sem isso o usuário não tem o que citar num relato de erro.
  echo_downstream: true
