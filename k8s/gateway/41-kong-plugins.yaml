# VALIDAÇÃO DE JWT NA BORDA. Sem token válido o Kong responde 401 e a requisição NUNCA chega ao
# microsserviço — o pacote não sai do namespace kong. Os serviços continuam validando por conta
# própria (defense in depth): a borda não substitui a autorização do serviço, ela a antecipa.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-jwt
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: jwt
config:
  # `iss` já é o default, mas explicitar documenta o acoplamento com JwtSettings__Issuer.
  key_claim_name: iss
  # Valida a expiração. SEM isto um token expirado passaria pela borda — o plugin só verifica as
  # claims listadas aqui.
  claims_to_verify:
    - exp
  # Superfície mínima: só o header Authorization. O default do plugin também aceita querystring
  # e cookie, o que permitiria vazar token em log de acesso / histórico de browser.
  header_names:
    - Authorization
  # Nossa chave é string UTF-8 crua, não base64.
  secret_is_base64: false
  # Não exigir JWT no preflight CORS (OPTIONS): senão o browser nem consegue perguntar.
  run_on_preflight: false
---
# RATE LIMITING na borda, por IP do cliente.
#
# ⚠️ NÃO use `limit_by: consumer` aqui. Uma versão anterior usava, com o comentário de que "o
# limite é POR TOKEN". Isso é FALSO na nossa topologia e foi medido no cluster:
#
#   O plugin jwt resolve o consumer pela claim `iss`, e TODO token emitido pelo users-api tem
#   `iss: FiapCloudGames`. Logo todos os usuários casam com o ÚNICO KongConsumer que existe, e
#   `limit_by: consumer` colapsa num contador GLOBAL da plataforma. Medição:
#     token B -> 200 | token A consome 125 req (119×200 + 6×429) | token B de novo -> 429
#   Um usuário esgota a cota e derruba TODOS os outros pela porta de entrada única. Auto-DoS.
#
#   `limit_by: credential` tem o mesmo defeito (a credencial também é única). Limite por usuário
#   exigiria um KongConsumer por usuário, o que não é declarável para usuários dinâmicos.
#
# `limit_by: ip` é o que resta como opção declarável.
#
# ⚠️ E o IP que conta é o que o KONG enxerga. Uma versão anterior deste comentário dizia que o
# `ForwardedHeaders` dos serviços tornava isso "o IP do cliente real" — RACIOCÍNIO ERRADO:
# `ForwardedHeaders__*` governa o `RemoteIpAddress` visto por users-api/catalog-api, não o
# contador do Kong. O Kong só confiaria em X-Forwarded-For com `trusted_ips`/`real_ip_header`
# configurados NELE, o que não é o caso hoje.
#
# Consequência prática, medida com dois pods: IPs distintos têm cotas independentes (pod A esgota
# com 120×200 e o pod B, de outro IP, segue em 200). Atrás de NAT, os clientes compartilham a
# cota; via `kubectl port-forward` todo o tráfego vira um único IP — por isso o teste de
# isolamento do gateway-test.sh usa dois pods, e não dois tokens.
#
# `policy: local` = contadores na memória de cada réplica. Com 1 réplica (nosso caso) é exato;
# com N réplicas o limite efetivo seria N × minute. Contador global exigiria `policy: redis`.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-rate-limit
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: rate-limiting
config:
  minute: 120
  policy: local
  limit_by: ip
  # Devolve os headers RateLimit-* (padrão IETF) para o cliente saber quanto sobrou.
  hide_client_headers: false
  # Falha ABERTA de propósito: se o backend de contagem falhar, não derrube a API.
  # Indisponibilidade do contador não pode virar indisponibilidade do produto.
  fault_tolerant: true
---
# RATE LIMITING das rotas PÚBLICAS — mais restritivo que o das protegidas, de propósito.
#
# Antes, `login`, `refresh` e o CADASTRO não tinham limite algum na borda. O cadastro é o único
# caminho de ESCRITA anônimo da plataforma e o menos protegido: `UsuariosController.Criar` não tem
# `[EnableRateLimiting]` (ao contrário do login, que tem no serviço). Sem limite, é criação
# ilimitada de contas — flood no Mongo e um UserCreatedEvent por requisição no RabbitMQ.
#
# O desenho anterior estava invertido: tráfego autenticado limitado, anônimo livre.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-rate-limit-publico
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: rate-limiting
config:
  minute: 20
  policy: local
  limit_by: ip
  hide_client_headers: false
  fault_tolerant: true
---
# CORRELATION ID: o Kong gera um X-Correlation-Id por requisição, propaga para o upstream e
# (com echo_downstream) devolve ao cliente. O CorrelationIdMiddleware de users-api/catalog-api lê
# o header e o coloca em HttpContext.TraceIdentifier, além de ecoá-lo na resposta.
#
# ⚠️ O QUE ISTO **NÃO** FAZ, apesar de ser tentador supor: o id NÃO entra nos logs dos serviços.
# Verificado no cluster — `kubectl logs deploy/users-api` tem ZERO ocorrências de correlation.
# O middleware não empurra o valor para o LogContext do Serilog, então o log estruturado sai com
# @tr/@sp (trace e span do OpenTelemetry) e RequestId, e nenhum campo de correlation.
#
# Para rastrear uma requisição ponta a ponta HOJE, o caminho que funciona é o **TraceId** (@tr no
# log, e o mesmo id no Jaeger). O valor prático deste plugin é dar ao cliente um id citável num
# relato de erro. Enriquecer o log com o correlation-id é melhoria de serviço (users-api /
# catalog-api), não de gateway.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: fcg-correlation-id
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
plugin: correlation-id
config:
  header_name: X-Correlation-Id
  generator: uuid
  # Devolve o id ao cliente também: sem isso o usuário não tem o que citar num relato de erro.
  echo_downstream: true
