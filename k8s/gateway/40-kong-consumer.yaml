# A credencial que este consumer referencia está em 39-kong-jwt-credential.yaml (minikube) ou
# vem do External Secrets (EKS, k8s-aws/10-external-secrets.yaml).
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: fcg-api-consumer
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
  annotations:
    kubernetes.io/ingress.class: kong
username: fcg-api-consumer
credentials:
  - fcg-jwt-credential
