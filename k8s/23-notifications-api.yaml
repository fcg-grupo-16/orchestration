apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
  namespace: fcg
  labels:
    app: notifications-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMq__Host: "rabbitmq"
  # Traces distribuídos por OTLP para o Jaeger (issue #27).
  OTEL_SERVICE_NAME: "notifications-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  # Database próprio (database-per-service). A connection string (com ?replicaSet=rs0) é
  # sensível e vem do SealedSecret notifications-api-secret. Consumido a partir da notifications-api#2.
  MongoDbSettings__DatabaseName: "notificationsdb"
---
# O Secret `notifications-api-secret` agora vem CIFRADO de k8s/05-sealed-secrets.yaml (Sealed Secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
  labels:
    app: notifications-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
      annotations:
        # Este serviço é worker (sem controller HTTP), então as métricas HTTP saem quase vazias —
        # o valor aqui são os TRACES: ele consome PaymentProcessedEvent, e sem instrumentá-lo o
        # trace da compra apareceria com um ramo cortado no Jaeger.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo "aguardando mongodb..."; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done']
      containers:
        - name: notifications-api
          image: notifications-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: notifications-api-config
            - secretRef:
                name: notifications-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-api
  namespace: fcg
  labels:
    app: notifications-api
spec:
  type: ClusterIP
  selector:
    app: notifications-api
  ports:
    - port: 80
      targetPort: 8080
