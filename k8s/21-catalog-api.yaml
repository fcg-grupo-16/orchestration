apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: fcg
  labels:
    app: catalog-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Traces distribuídos por OTLP para o Jaeger (issue #27). Nomes padrão do OpenTelemetry,
  # lidos automaticamente pelo SDK. Endpoint AUSENTE = exportador desligado, que é o que
  # mantém `dotnet run` e os testes de integração funcionando sem Jaeger no ar.
  OTEL_SERVICE_NAME: "catalog-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  RabbitMq__Host: "rabbitmq"
  MongoDbSettings__DatabaseName: "catalogdb"
  # Cache distribuído (Fase 3). A connection string é sensível e vem do SealedSecret
  # catalog-api-secret; `InstanceName` prefixa TODA chave escrita por este serviço, que é o
  # que isola logicamente os keyspaces na instância compartilhada de Redis.
  # `Enabled` é o INTERRUPTOR: sem ele o serviço sobe com cache no-op (o default em
  # appsettings.json é conservador) e o requisito obrigatório da Fase 3 ficaria inativo no
  # cluster, mesmo com o Redis provisionado e a connection string injetada.
  Redis__Enabled: "true"
  Redis__InstanceName: "fcg:catalog:"
  # Operação atrás do Kong (issue #26). X-Forwarded-* é header que o CLIENTE controla, então a
  # confiança é restrita às redes do cluster: pods e Services do minikube. Sem isto, o Location
  # dos 201 sai com o host interno (catalog-api:8080) e os logs registram o IP do pod do gateway.
  # Os MESMOS CIDRs valem para o users-api — divergir aqui é dívida que alguém paga depois.
  ForwardedHeaders__Enabled: "true"
  ForwardedHeaders__KnownNetworks__0: "10.244.0.0/16"
  ForwardedHeaders__KnownNetworks__1: "10.96.0.0/12"
  ForwardedHeaders__ForwardLimit: "1"
  JwtSettings__Issuer: "FiapCloudGames"
  JwtSettings__Audience: "FiapCloudGames"
---
# O Secret `catalog-api-secret` agora vem CIFRADO de k8s/05-sealed-secrets.yaml (Sealed Secrets).
# JwtSettings__SecretKey é idêntica à do users-api-secret (valida o JWT emitido por ele) — ver seal-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: fcg
  labels:
    app: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
      annotations:
        # Descoberta pelo Prometheus (issue #27). O scrape_config `fcg-pods` filtra por esta
        # annotation, lê a porta daqui e usa o label `app` acima como label `service` nas séries.
        # O endpoint /metrics passa a existir com a instrumentação OpenTelemetry do serviço.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo "aguardando mongodb..."; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "aguardando redis..."; sleep 2; done']
      containers:
        - name: catalog-api
          image: catalog-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-api-config
            - secretRef:
                name: catalog-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: fcg
  labels:
    app: catalog-api
spec:
  type: ClusterIP
  selector:
    app: catalog-api
  ports:
    - port: 80
      targetPort: 8080
