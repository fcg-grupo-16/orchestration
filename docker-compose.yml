# FIAP Cloud Games (FCG) — Fase 4
# Orquestração completa da plataforma de microsserviços.
#
# Os serviços são construídos a partir dos repositórios IRMÃOS deste repo.
# Estrutura esperada no diretório pai:
#   fiap/
#   ├── orchestration/   (este repo)
#   ├── users-api/
#   ├── catalog-api/
#   └── payments-api/
#
# Subir tudo:   docker compose up --build
# Derrubar:     docker compose down -v

name: fcg

x-jwt-secret: &jwt-secret "FiapCloudGames_Demo_SecretKey_Com_Pelo_Menos_256_Bits_Para_HMAC_SHA256!"
# Chave de SERVIÇO-A-SERVIÇO (notifications-function#9). DIFERENTE da de cima de propósito: o
# users-api RECUSA subir se as duas forem iguais, porque a separação de privilégio depende disso.
x-service-secret: &service-secret "FiapCloudGames_Demo_ServiceKey_DISTINTA_Com_256_Bits_Para_HMAC_SHA256!"

services:
  # ---------------- Infraestrutura ----------------
  rabbitmq:
    # Imagem custom: rabbitmq:3.13-management + plugin rabbitmq_delayed_message_exchange
    # (exigido pelo delayed redelivery do MassTransit no catalog-api). Ver docker/rabbitmq/.
    build: ./docker/rabbitmq
    image: fcg-rabbitmq:local
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: fcg-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (err) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # Camada de cache distribuído da plataforma (Fase 3). Imagem pinada no PATCH, como o resto da infra.
    image: redis:7.4.1-alpine
    container_name: fcg-redis
    # --maxmemory + allkeys-lru: cache NUNCA pode derrubar o container por OOM. Ao atingir o teto,
    # o Redis descarta as chaves menos usadas — comportamento correto aqui, porque todo dado é
    # reconstruível a partir do MongoDB.
    # --save "" e --appendonly no desligam a persistência em disco: é cache, não banco.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      # Bind SÓ no loopback, diferente de mongodb/rabbitmq. O Redis roda sem `requirepass` e com
      # `protected-mode no`, então o usuário `default` tem +@all sem senha: publicar em 0.0.0.0
      # daria FLUSHALL, leitura do cache (que conterá dados de usuário) e CONFIG SET a qualquer
      # máquina na mesma rede. Loopback custa zero e fecha o vetor.
      - "127.0.0.1:6379:6379"
    # Teto de memória do CONTAINER, acima do --maxmemory do Redis (256mb) — paridade com o
    # limits.memory do k8s. Sem isto, o comentário acima sobre "não derrubar o container por OOM"
    # não teria teto nenhum para proteger.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Motor de busca da Fase 4 — alimenta o /search do catalog-api (catalog-api#30 e #31).
  #
  # ⚠️ AMBIENTE DE DESENVOLVIMENTO, não o desenho de produção: nó único e plugin de segurança
  # DESLIGADO. Em produção é o OpenSearch gerenciado da AWS (orchestration#67), com TLS e
  # autenticação. A API é a mesma nos dois, então o código do catalog-api não muda — só o endereço.
  #
  # Sem volume de propósito: o índice é DERIVADO do MongoDB (fonte da verdade) e reconstruível a
  # partir dele. `docker compose down` apaga o índice, e isso é aceitável — não há dado só aqui.
  opensearch:
    image: opensearchproject/opensearch:2.19.0   # tag PINADA, nunca :latest
    container_name: fcg-opensearch
    environment:
      # Sem isto o OpenSearch tenta formar cluster, não encontra outros nós e NÃO SOBE.
      discovery.type: single-node
      # Sem isto ele exige HTTPS + senha de admin, e o catalog-api teria de carregar certificado
      # para falar com um container local.
      DISABLE_SECURITY_PLUGIN: "true"
      # Heap FIXO da JVM. Sem teto, a JVM reserva metade da RAM do host e disputa memória com o
      # resto da plataforma — que já tem histórico de probe estourando timeout por falta de recurso.
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Loopback, como o redis: com o plugin de segurança desligado, QUALQUER cliente que alcance a
      # porta lê, sobrescreve e apaga índices (`DELETE /_all`) sem credencial nenhuma.
      - "127.0.0.1:9200:9200"
    # Teto do CONTAINER acima do heap: a JVM usa memória fora do heap (metaspace, buffers diretos,
    # threads). Medido: ~925 MiB em repouso e ~970 MiB com 20 mil documentos indexados e consulta
    # fuzzy — 1,5 GiB deixa folga sem deixar a JVM crescer sem limite.
    mem_limit: 1536m
    healthcheck:
      # `curl` existe dentro desta imagem. `wait_for_status=yellow` faz o check falhar enquanto o
      # cluster está RED (subindo) — só responder HTTP não basta.
      #
      # YELLOW, e não GREEN, de propósito: num nó único, todo índice criado com a réplica padrão
      # (number_of_replicas=1) deixa o cluster YELLOW — a réplica não tem outro nó onde ficar.
      # Exigir green derrubaria o healthcheck assim que o catalog-api criasse o índice `jogos`.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ---------------- Observabilidade (Fase 3, Opção A) ----------------
  # No compose a descoberta é por lista estática (docker/prometheus/prometheus.yml); no k8s é por
  # annotation de pod. O label `service` é o mesmo nos dois, então o dashboard versionado em
  # observability/fcg-overview.json funciona nos dois ambientes sem alteração.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fcg-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Loopback, como o redis: a UI do Prometheus não tem autenticação nenhuma e expõe a telemetria
      # inteira da plataforma. 9090 é uma porta MUITO disputada — se já estiver ocupada na sua
      # máquina, remapeie no docker-compose.override.yml (gitignored), nunca aqui.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: fcg-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # MESMO arquivo que alimenta o ConfigMap do cluster — dashboard versionado uma vez só.
      - ./observability:/etc/grafana/dashboards:ro
    ports:
      # Loopback: a credencial é admin/admin.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: fcg-jaeger
    environment:
      # Sem isto o Jaeger sobe mas NÃO escuta OTLP, e os serviços falham a exportar em silêncio.
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      # ~62 KiB por trace de 12 spans (medido): 5000 traces ≈ 330 MiB. Ver k8s/42 para o raciocínio
      # completo — 20000 estouraria o limite de memória do container antes de o teto agir.
      MEMORY_MAX_TRACES: "5000"
      GOMEMLIMIT: "700MiB"
    ports:
      # Loopback: a UI do Jaeger não tem autenticação e os receivers OTLP aceitam spans de
      # qualquer origem. 4317/4318 são as portas padrão de OTLP e costumam estar ocupadas por
      # outro coletor na máquina — remapeie no override local se for o caso.
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    restart: unless-stopped

  # ---------------- Microsserviços ----------------
  users-api:
    build:
      context: ../users-api
    image: users-api:local
    container_name: fcg-users-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "usersdb"
      # Cache distribuído (consumido a partir da users-api#20). InstanceName é o prefixo de TODA
      # chave escrita por este serviço — é o que isola logicamente os keyspaces na instância
      # compartilhada de Redis (mesma filosofia do database-per-service no Mongo).
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "fcg:users:"
      # Traces distribuídos por OTLP para o Jaeger (issue #27). Endpoint AUSENTE = exportador
      # desligado — é o que mantém `dotnet run` funcionando sem Jaeger no ar.
      OTEL_SERVICE_NAME: "users-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      JwtSettings__SecretKey: *jwt-secret
      JwtSettings__Issuer: "FiapCloudGames"
      JwtSettings__Audience: "FiapCloudGames"
      ServiceAuth__SecretKey: *service-secret
      ServiceAuth__Issuer: "FiapCloudGames.Servicos"
      ServiceAuth__Audience: "FiapCloudGames.Servicos"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    ports:
      - "8081:8080"
    restart: unless-stopped

  catalog-api:
    build:
      context: ../catalog-api
    image: catalog-api:local
    container_name: fcg-catalog-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_healthy, e não só o nome: sem a condição o compose sobe o catalog-api quando o
      # container do OpenSearch EXISTE, não quando ele RESPONDE — a indexação falha e parece bug.
      opensearch:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "catalogdb"
      # Busca avançada (Fase 4, catalog-api#30). Endpoint AUSENTE = busca desligada, mesma convenção
      # do OTEL_EXPORTER_OTLP_ENDPOINT: mantém `dotnet run` funcionando sem OpenSearch no ar.
      OpenSearch__Endpoint: "http://opensearch:9200"
      OpenSearch__IndiceJogos: "jogos"
      # Cache distribuído (consumido a partir da catalog-api#21). Prefixo PRÓPRIO: mesma instância
      # de Redis, keyspace separado do users-api.
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "fcg:catalog:"
      # Traces distribuídos por OTLP para o Jaeger (issue #27). Endpoint AUSENTE = exportador
      # desligado — é o que mantém `dotnet run` funcionando sem Jaeger no ar.
      OTEL_SERVICE_NAME: "catalog-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      JwtSettings__SecretKey: *jwt-secret   # DEVE ser idêntica à do users-api
      JwtSettings__Issuer: "FiapCloudGames"
      JwtSettings__Audience: "FiapCloudGames"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    ports:
      - "8082:8080"
    restart: unless-stopped

  payments-api:
    build:
      context: ../payments-api
    image: payments-api:local
    container_name: fcg-payments-api
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Payments__MaxApprovedAmount: "5000"
      # Traces distribuídos por OTLP para o Jaeger (issue #27). Endpoint AUSENTE = exportador
      # desligado — é o que mantém `dotnet run` funcionando sem Jaeger no ar.
      OTEL_SERVICE_NAME: "payments-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      # Persistência de pagamentos (paymentsdb) — consumida a partir da payments-api#2.
      # ?replicaSet=rs0 é obrigatório para as transações do inbox/outbox.
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "paymentsdb"
    ports:
      - "8083:8080"
    restart: unless-stopped

volumes:
  mongo-data:
