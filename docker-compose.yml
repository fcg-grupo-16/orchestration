# FIAP Cloud Games (FCG) — Fase 2
# Orquestração completa da plataforma de microsserviços.
#
# Os serviços são construídos a partir dos repositórios IRMÃOS deste repo.
# Estrutura esperada no diretório pai:
#   fiap/
#   ├── orchestration/   (este repo)
#   ├── users-api/
#   ├── catalog-api/
#   ├── payments-api/
#   └── notifications-api/
#
# Subir tudo:   docker compose up --build
# Derrubar:     docker compose down -v

name: fcg

x-jwt-secret: &jwt-secret "FiapCloudGames_Demo_SecretKey_Com_Pelo_Menos_256_Bits_Para_HMAC_SHA256!"

services:
  # ---------------- Infraestrutura ----------------
  rabbitmq:
    # Imagem custom: rabbitmq:3.13-management + plugin rabbitmq_delayed_message_exchange
    # (exigido pelo delayed redelivery do MassTransit no catalog-api). Ver docker/rabbitmq/.
    build: ./docker/rabbitmq
    image: fcg-rabbitmq:local
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: fcg-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (err) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # Camada de cache distribuído da plataforma (Fase 3). Imagem pinada no PATCH, como o resto da infra.
    image: redis:7.4.1-alpine
    container_name: fcg-redis
    # --maxmemory + allkeys-lru: cache NUNCA pode derrubar o container por OOM. Ao atingir o teto,
    # o Redis descarta as chaves menos usadas — comportamento correto aqui, porque todo dado é
    # reconstruível a partir do MongoDB.
    # --save "" e --appendonly no desligam a persistência em disco: é cache, não banco.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ---------------- Microsserviços ----------------
  users-api:
    build:
      context: ../users-api
    image: users-api:local
    container_name: fcg-users-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "usersdb"
      # Cache distribuído (consumido a partir da users-api#20). InstanceName é o prefixo de TODA
      # chave escrita por este serviço — é o que isola logicamente os keyspaces na instância
      # compartilhada de Redis (mesma filosofia do database-per-service no Mongo).
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "fcg:users:"
      JwtSettings__SecretKey: *jwt-secret
      JwtSettings__Issuer: "FiapCloudGames"
      JwtSettings__Audience: "FiapCloudGames"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    ports:
      - "8081:8080"
    restart: unless-stopped

  catalog-api:
    build:
      context: ../catalog-api
    image: catalog-api:local
    container_name: fcg-catalog-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "catalogdb"
      # Cache distribuído (consumido a partir da catalog-api#21). Prefixo PRÓPRIO: mesma instância
      # de Redis, keyspace separado do users-api.
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "fcg:catalog:"
      JwtSettings__SecretKey: *jwt-secret   # DEVE ser idêntica à do users-api
      JwtSettings__Issuer: "FiapCloudGames"
      JwtSettings__Audience: "FiapCloudGames"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    ports:
      - "8082:8080"
    restart: unless-stopped

  payments-api:
    build:
      context: ../payments-api
    image: payments-api:local
    container_name: fcg-payments-api
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Payments__MaxApprovedAmount: "5000"
      # Persistência de pagamentos (paymentsdb) — consumida a partir da payments-api#2.
      # ?replicaSet=rs0 é obrigatório para as transações do inbox/outbox.
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "paymentsdb"
    ports:
      - "8083:8080"
    restart: unless-stopped

  notifications-api:
    build:
      context: ../notifications-api
    image: notifications-api:local
    container_name: fcg-notifications-api
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      # Histórico de notificações (notificationsdb) — consumido a partir da notifications-api#2.
      # ?replicaSet=rs0 mantém a paridade da connection string com os demais serviços.
      MongoDbSettings__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDbSettings__DatabaseName: "notificationsdb"
    ports:
      - "8084:8080"
    restart: unless-stopped

volumes:
  mongo-data:
