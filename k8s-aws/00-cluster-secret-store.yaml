# De onde o External Secrets lê: o AWS Secrets Manager da conta (#65, ADR 0011).
#
# SEM bloco `auth`, de propósito. Sem ele o operador usa a cadeia padrão de credenciais da AWS, que
# chega à role do NÓ (LabRole) pelo IMDSv2. É o único caminho no AWS Academy, que não permite criar a
# role que o IRSA exigiria. Consequência registrada na ADR 0010: não há menor privilégio por pod.
#
# ClusterSecretStore, e não SecretStore: o operador roda no namespace external-secrets e os Secrets
# vão para o fcg; um store de cluster serve aos dois sem duplicar configuração.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
