        labels:
          app.kubernetes.io/part-of: fiap-cloud-games
          app: notifications-function
  dataFrom:
    - extract:
        key: fcg/notifications-function-secret
---
# `host`: a conexão AMQP que o scaler do KEDA usa para ler o tamanho da fila.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keda-rabbitmq-secret
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: keda-rabbitmq-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: fiap-cloud-games
          app: notifications-function
  dataFrom:
    - extract:
        key: fcg/keda-rabbitmq-secret
---
# Credencial do plugin jwt do Kong: a TERCEIRA ponta da paridade do JWT.
#
# ⚠️ O label `konghq.com/credential: jwt` é OBRIGATÓRIO: é por ele que o KIC 3.x reconhece o Secret
# como credencial. Sem ele, o gateway devolve 401 para todo token válido, sem erro claro (ver o
# comentário de k8s/gateway/39-kong-jwt-credential.yaml, que é o equivalente no minikube).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fcg-jwt-credential
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: fcg-jwt-credential
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: fiap-cloud-games
          konghq.com/credential: jwt
  dataFrom:
    - extract:
        key: fcg/fcg-jwt-credential
