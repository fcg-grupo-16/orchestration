# Os Secrets da plataforma, materializados a partir do AWS Secrets Manager (#65, ADR 0011).
#
# Cada ExternalSecret cria o Secret com o MESMO NOME que os Deployments já usam em `envFrom`. Assim
# nenhum manifesto de serviço muda entre minikube (SealedSecret) e EKS (ExternalSecret): muda só a
# origem do conteúdo.
#
# `dataFrom.extract`: o segredo no Secrets Manager é um JSON {CHAVE: valor}, publicado por
# scripts/publicar-segredos-aws.sh, e cada chave vira uma chave do Secret.
#
# `refreshInterval: 1h`: rotação sem redeploy do Secret. Os pods leem env só no start; depois de
# rotacionar, `kubectl -n fcg rollout restart deploy/<servico>`.
#
# ⚠️ Paridade tríplice do JWT: users-api-secret, catalog-api-secret e fcg-jwt-credential (Kong) têm de
# carregar a MESMA chave. Aqui isso é garantido na origem: o script de publicação lê uma única
# variável para os três.
---
# RABBITMQ_DEFAULT_USER e RABBITMQ_DEFAULT_PASS do broker.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-secret
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rabbitmq-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: fiap-cloud-games
  dataFrom:
    - extract:
        key: fcg/rabbitmq-secret
---
# JwtSettings__SecretKey (emite o JWT) e ServiceAuth__SecretKey (ADR 0007), entre outras.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users-api-secret
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: users-api-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: fiap-cloud-games
          app: users-api
  dataFrom:
    - extract:
        key: fcg/users-api-secret
---
# JwtSettings__SecretKey idêntica à do users-api: valida o JWT.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-api-secret
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
