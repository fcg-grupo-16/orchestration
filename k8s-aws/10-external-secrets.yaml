    kind: ClusterSecretStore
  target:
    name: catalog-api-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: fiap-cloud-games
          app: catalog-api
  dataFrom:
    - extract:
        key: fcg/catalog-api-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-api-secret
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
