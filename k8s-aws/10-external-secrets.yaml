---
# ServiceAuth__SecretKey idêntica à do users-api, e DIFERENTE da do JWT.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notifications-function-secret
  namespace: fcg
  labels:
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
